<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tu - Tìm lại sự tĩnh lặng</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&family=Playfair+Display:italic&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fcfcfc;
            --text-color: #2c2c2c;
            --accent-color: #8e8e8e;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .container {
            text-align: center;
            max-width: 600px;
            padding: 20px;
            animation: fadeIn 2s ease-in-out;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: 4rem;
            font-weight: normal;
            margin-bottom: 0.5rem;
            letter-spacing: 0.2rem;
        }

        p.tagline {
            font-size: 1.1rem;
            color: var(--accent-color);
            letter-spacing: 0.1rem;
            margin-bottom: 2rem;
        }

        .circle {
            width: 60px;
            height: 60px;
            border: 1px solid #e0e0e0;
            border-radius: 50%;
            margin: 0 auto 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .circle::after {
            content: "";
            width: 10px;
            height: 10px;
            background-color: var(--accent-color);
            border-radius: 50%;
            animation: breathe 4s infinite ease-in-out;
        }

        .links {
            margin-top: 3rem;
        }

        a {
            text-decoration: none;
            color: var(--text-color);
            font-size: 0.9rem;
            margin: 0 15px;
            transition: opacity 0.3s;
            border-bottom: 1px solid transparent;
        }

        a:hover {
            opacity: 0.6;
            border-bottom: 1px solid var(--text-color);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(2.5); opacity: 0.1; }
        }

        @media (max-width: 600px) {
            h1 { font-size: 3rem; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="circle"></div>
        <h1>Tu</h1>
        <p class="tagline">Hơi thở là điểm tựa.</p>
        
        <div class="description">
            <p>Một không gian số tối giản giúp bạn quay về với hiện tại.</p>
        </div>

        <div class="links">
            <a href="#">App Store</a>
            <a href="#">Privacy Policy</a>
            <a href="mailto:contact@tu.app">Support</a>
        </div>
    </div>

</body>
</html>
